name: Deploy
on:
  workflow_dispatch:

env:
  SUBSCRIPTION_ID: '6e3989a8-f17c-46a2-b3c4-944f5e8b3a60'
  API_NAME: 'func-api-theassistant-weu'
  LOGIN_API_NAME: 'func-loginapi-theassistant-weu'
  RESOURCE_GROUP: 'Apps'
  API_PROJECT_PATH: './Src/TheAssistantApi/TheAssistantApi.csproj'
  LOGIN_API_PROJECT_PATH: './Src/TheAssistantApi.Login/TheAssistantApi.Login.csproj'
  API_PUBLISH_PATH: './Src/TheAssistantApi/output'
  LOGIN_API_PUBLISH_PATH: './Src/TheAssistantApi.Login/output'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2
    
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4.3.1
      with: 
            dotnet-version: '8.0.x'

    - name: Build solution
      run: |
        dotnet restore
        dotnet build --configuration Release

    - name: Publish Function App
      run:  |
        dotnet restore ${{ env.API_PROJECT_PATH }}
        dotnet clean ${{ env.API_PROJECT_PATH }}
        dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o ${{ env.API_PUBLISH_PATH}} --no-restore /nodeReuse:false

    - name: Publish Function Login App
      run:  |
        dotnet restore ${{ env.LOGIN_API_PROJECT_PATH}}
        dotnet clean ${{ env.LOGIN_API_PROJECT_PATH}}
        dotnet publish ${{ env.LOGIN_API_PROJECT_PATH}} -c Release -o ${{ env.LOGIN_API_PUBLISH_PATH}} --no-restore /nodeReuse:false
    
    - name: 'Login via Azure CLI'
      uses: Azure/login@v2.3.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID  }}

    - name: 'Deploy Azure infrastructure'
      shell: pwsh
      run: |
        cd ./Infra
        .\deploy.ps1 `
          -deploy

    # - name: 'Get Azure Configuration'
    #   id: GetAzureConfig
    #   uses: Azure/cli@v2.1.0
    #   with:
    #     azcliversion: 2.72.0
    #     inlineScript: |
    #        apiPublishProfile=$(az webapp deployment list-publishing-profiles --name ${{ env.API_NAME}} --resource-group ${{ env.RESOURCE_GROUP}} --xml)
    #        loginApiPublishProfile=$(az webapp deployment list-publishing-profiles --name ${{ env.LOGIN_API_NAME}} --resource-group ${{ env.RESOURCE_GROUP}} --xml)
    #        echo "apiPublishProfile=$apiPublishProfile" >> $GITHUB_OUTPUT
    #        echo "loginApiPublishProfile=$loginApiPublishProfile" >> $GITHUB_OUTPUT
    #        echo "::add-mask::$apiPublishProfile"
    #        echo "::add-mask::$loginApiPublishProfile"

    - name: 'Deploy The Assistant Api code'
      uses: Azure/functions-action@v1.5.3
      with:
        app-name:  ${{ env.API_NAME }}
        package: ${{ env.API_PUBLISH_PATH }}
        # publish-profile: ${{ steps.GetAzureConfig.outputs.apiPublishProfile  }}    
        sku: flexconsumption
        remote-build: false

    - name: 'Deploy The Assistant Login Api code'
      uses: Azure/functions-action@v1.5.3
      with:
        app-name: ${{ env.LOGIN_API_NAME }}
        package: ${{ env.LOGIN_API_PUBLISH_PATH }}
        # publish-profile: ${{ steps.GetAzureConfig.outputs.loginApiPublishProfile  }}    
        sku: flexconsumption
        remote-build: false  