name: Deploy
on:
  workflow_dispatch:

env:
  SUBSCRIPTION_ID: '6e3989a8-f17c-46a2-b3c4-944f5e8b3a60'
  API_NAME: 'func-api-theassistant-weu'
  LOGIN_API_NAME: 'func-loginapi-theassistant-weu'
  RESOURCE_GROUP: 'Apps'
  API_PROJECT_PATH: './Src/TheAssistantApi/TheAssistantApi.csproj'
  LOGIN_API_PROJECT_PATH: './Src/TheAssistantApi.Login/TheAssistantApi.Login.csproj'
  API_PUBLISH_PATH: './Src/TheAssistantApi/output'
  LOGIN_API_PUBLISH_PATH: './Src/TheAssistantApi.Login/output'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2
    
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4.3.1
      with: 
            dotnet-version: '8.0.x'

    - name: Build solution
      run: |
        dotnet restore
        dotnet build --configuration Release

    - name: Publish Function App
      run:  |
        dotnet restore $API_PROJECT_PATH
        dotnet clean $API_PROJECT_PATH
        dotnet publish $API_PROJECT_PATH -c Release -o $API_PUBLISH_PATH --no-restore /nodeReuse:false

    - name: Publish Function Login App
      run:  dotnet publish $LOGIN_API_PROJECT_PATH -c Release -o $LOGIN_API_PUBLISH_PATH
    
    - name: Sync system clock
      run: |
        sudo apt-get update
        sudo apt-get install -y ntpdate
        sudo ntpdate -s time.nist.gov
      if: runner.os == 'Linux'

    - name: Sync system clock (Windows)
      run: |
        w32tm /resync /force
      if: runner.os == 'Windows'

    - name: 'Login via Azure CLI'
      uses: Azure/login@v2.3.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID  }}
        auth-type: 'OIDC'

    - name: 'Deploy Azure infrastructure'
      shell: pwsh
      run: |
        cd ./Infra
        .\deploy.ps1 `
          -deploy

    - name: 'Deploy The Assistant Api code'
      uses: Azure/functions-action@v1.5.3
      with:
        app-name: ${{ env.API_NAME}}
        package: ${{ env.API_PUBLISH_PATH}}

    - name: 'Deploy The Assistant Login Api code'
      uses: Azure/functions-action@v1.5.3
      with:
        app-name: ${{ env.LOGIN_API_NAME}}
        package: ${{ env.LOGIN_API_PUBLISH_PATH}}


    - name: Upload secrets to Key Vault
      run: |
        az keyvault secret set --vault-name $KEYVAULT_NAME --name "Notion--ClientSecret" --value "${{ secrets.NOTION_CLIENT_SECRET }}"
        az keyvault secret set --vault-name $KEYVAULT_NAME --name "Login--Consumer--ClientSecret" --value "${{ secrets.LOGIN_CONSUMER_CLIENT_SECRET }}"
        az keyvault secret set --vault-name $KEYVAULT_NAME --name "Agents--AzureOpenAiApiKey" --value "${{ secrets.AGENTS_AZURE_OPENAI_API_KEY }}"
      env:
        KEYVAULT_NAME: kv-theassistant-weu

    - name: Parse and upload appsettings to all Function Apps
      run: |
        # Read appsettings.json and flatten JSON to key=value pairs
        SETTINGS=$(jq -r '
          paths(scalars) as $p |
          ($p | map(tostring) | join("__")) as $key |
          "\($key)=\((getpath($p)))"
        ' Config/appsettings.json)

        # Loop through each Function App
        for APP in $FUNCTION_APPS; do
          echo "Updating $APP..."
          az functionapp config appsettings set \
            --name "$APP" \
            --resource-group "$RESOURCE_GROUP" \
            --settings $SETTINGS
        done
      env:
        FUNCTION_APPS: "func-api-theassistant-weu func-loginapi-theassistant-weu"
        RESOURCE_GROUP: "Apps"

